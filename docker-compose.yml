# Local Postgres for dev and tests (Q4). One container, two databases:
# mandibuddy_dev (the app) and mandibuddy_test (wiped by server tests).
# Host port 5433 because a local PostgreSQL service already uses 5432.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mandibuddy
      POSTGRES_PASSWORD: mandibuddy
      POSTGRES_DB: mandibuddy_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandibuddy -d mandibuddy_dev"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
